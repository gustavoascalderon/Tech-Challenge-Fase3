# Stack de monitoramento: API + Prometheus + Grafana
# Subir:  docker compose up --build
services:
  api:
    build: .
    container_name: triagem-api
    environment:
      MODEL_BACKEND: onnx # troque para "sklearn" para medir o baseline
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: triagem-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    container_name: triagem-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
